[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# Design tokens. ui/theme.py reads these so charts and custom elements stay in
# sync with Streamlit's own widgets. Inputs are white on a paper page so that
# editable fields read differently from the tinted prediction panel.
[theme]
base = "light"
primaryColor = "#0E6B6B"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D2126"
linkColor = "#0E6B6B"
borderColor = "#D9D7CF"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
codeBackgroundColor = "#F1F0EA"
dataframeHeaderBackgroundColor = "#F3F2EC"
redColor = "#B3261E"
orangeColor = "#B4561F"
yellowColor = "#8A6D10"
greenColor = "#3F7D58"
blueColor = "#0E6B6B"
grayColor = "#62666D"
chartCategoricalColors = ["#0E6B6B", "#B4561F", "#3F7D58", "#8A6D10", "#62666D"]

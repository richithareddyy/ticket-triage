[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# ui/theme.py reads these so charts and custom elements match Streamlit's widgets.
[theme]
base = "light"
primaryColor = "#173F4F"
backgroundColor = "#EFE6D3"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#1E2A30"
linkColor = "#173F4F"
borderColor = "#D3C6AA"
showWidgetBorder = true
baseFontSize = 14
baseRadius = "3px"
buttonRadius = "3px"
codeBackgroundColor = "#EAE2D1"
dataframeHeaderBackgroundColor = "#EAE2D1"
redColor = "#B3261E"
orangeColor = "#A84A12"
yellowColor = "#7D6209"
greenColor = "#2F6F4E"
blueColor = "#173F4F"
grayColor = "#575C5E"
chartCategoricalColors = ["#173F4F", "#A84A12", "#2F6F4E", "#7D6209", "#5E6468"]

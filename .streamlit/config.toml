[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# Design tokens. ui/theme.py reads these so charts and custom elements stay in
# sync with Streamlit's own widgets.
[theme]
base = "light"
primaryColor = "#0E6B6B"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F1F0EA"
textColor = "#1D2126"
linkColor = "#0E6B6B"
borderColor = "#DDDBD3"
showWidgetBorder = true
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
codeBackgroundColor = "#F1F0EA"
dataframeHeaderBackgroundColor = "#F1F0EA"
redColor = "#B3261E"
orangeColor = "#C0602A"
yellowColor = "#9A7A14"
greenColor = "#3F7D58"
blueColor = "#0E6B6B"
grayColor = "#6A6E75"
chartCategoricalColors = ["#0E6B6B", "#C0602A", "#3F7D58", "#9A7A14", "#6A6E75"]
